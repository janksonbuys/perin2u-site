<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img" aria-label="Ammonia slip sensor downstream of SCR catalyst, construction drawing">
  <rect width="520" height="380" fill="#F5F1E8"/>
  <g stroke="#D4CDB0" stroke-width="1">
    <line x1="40" y1="40" x2="480" y2="40"/><line x1="40" y1="300" x2="480" y2="300"/>
    <line x1="40" y1="40" x2="40" y2="300"/><line x1="480" y1="40" x2="480" y2="300"/>
  </g>

  <!-- urea dosing -->
  <g transform="translate(96,58)">
    <path d="M0 0h34l10 14H-10z" fill="none" stroke="#1A2332" stroke-width="1.4"/>
    <path d="M8 14v10M17 14v16M26 14v10" stroke="#C89B50" stroke-width="1.2"/>
  </g>
  <text x="96" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" letter-spacing="1.8" fill="#8A92A1">UREA / AdBlue</text>

  <!-- exhaust flow -->
  <g stroke="#D4CDB0" stroke-width="1.2" stroke-dasharray="5 5" fill="none">
    <path d="M44 210h30M250 210h216"/>
  </g>
  <path d="M452 210l10 0M452 205l9 5-9 5" stroke="#8A92A1" stroke-width="1.2" fill="none"/>

  <!-- SCR catalyst -->
  <rect x="74" y="168" width="176" height="86" fill="#fff" stroke="#1A2332" stroke-width="1.6"/>
  <path d="M92 168v86M110 168v86M128 168v86M146 168v86M164 168v86M182 168v86M200 168v86M218 168v86M236 168v86" stroke="#D4CDB0" stroke-width="1"/>
  <text x="162" y="216" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2.2" fill="#1A2332">SCR</text>
  <text x="162" y="278" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6" fill="#6A7280">CATALYST</text>

  <!-- exhaust pipe downstream -->
  <path d="M250 176h206M250 244h206" stroke="#1A2332" stroke-width="1.6" fill="none"/>

  <!-- NH3 sensor mounted in pipe -->
  <rect x="334" y="196" width="28" height="30" fill="#fff" stroke="#1A2332" stroke-width="1.4"/>
  <path d="M338 200h20M338 206h20M338 212h20" stroke="#C89B50" stroke-width="1"/>
  <rect x="326" y="176" width="44" height="20" fill="none" stroke="#1A2332" stroke-width="1.6"/>
  <rect x="334" y="86" width="28" height="90" fill="none" stroke="#1A2332" stroke-width="1.6"/>
  <path d="M340 96v70M348 96v70M356 96v70" stroke="#D4CDB0" stroke-width="1"/>

  <!-- cable to ECU -->
  <path d="M348 86v-14c0-8 6-12 14-12h56" fill="none" stroke="#1A2332" stroke-width="2.2"/>
  <rect x="418" y="46" width="52" height="30" rx="2" fill="#fff" stroke="#1A2332" stroke-width="1.4"/>
  <text x="444" y="65" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" letter-spacing="1.2" fill="#8A92A1">ECU</text>

  <!-- callouts -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6A7280" letter-spacing="1.3">
    <g stroke="#C89B50" stroke-width="1" fill="none">
      <path d="M330 240h-46v30"/>
      <path d="M362 130h62v-28"/>
      <path d="M362 160h30"/>
    </g>
    <text x="284" y="284" text-anchor="middle">SENSING TIP</text>
    <text x="428" y="120" text-anchor="end">PLANAR ELEMENT ＋ HEATER</text>
    <text x="396" y="164" text-anchor="start"></text>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="40" y="324" font-size="11" letter-spacing="3" fill="#C89B50">NH₃ · AMMONIA SLIP · SCR CLOSED LOOP</text>
    <text x="40" y="344" font-size="9.5" letter-spacing="1.2" fill="#8A92A1">NO AIR REFERENCE · CHINA 6 / EURO VI–VII · DOSING FEEDBACK</text>
  </g>
</svg>
