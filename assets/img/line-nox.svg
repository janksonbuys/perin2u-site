<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img" aria-label="NOx sensor construction drawing">
  <rect width="520" height="380" fill="#F5F1E8"/>
  <g stroke="#D4CDB0" stroke-width="1">
    <line x1="40" y1="40" x2="480" y2="40"/><line x1="40" y1="340" x2="480" y2="340"/>
    <line x1="40" y1="40" x2="40" y2="340"/><line x1="480" y1="40" x2="480" y2="340"/>
  </g>

  <!-- control unit -->
  <g transform="translate(80,64)">
    <rect x="0" y="0" width="104" height="74" rx="3" fill="#fff" stroke="#1A2332" stroke-width="1.6"/>
    <path d="M10 14h44M10 24h30" stroke="#1A2332" stroke-width="1.4"/>
    <rect x="10" y="34" width="84" height="12" fill="none" stroke="#C89B50" stroke-width="1"/>
    <path d="M10 58h84" stroke="#D4CDB0" stroke-width="1"/>
    <circle cx="90" cy="64" r="2.4" fill="#C89B50"/>
    <text x="10" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="7.5" letter-spacing="1.6" fill="#8A92A1">CONTROL UNIT</text>
  </g>

  <!-- cable to sensor -->
  <path d="M184 101h38c10 0 12 8 12 8" fill="none" stroke="#1A2332" stroke-width="2.4"/>
  <path d="M234 109h30c10 0 12 10 12 18" fill="none" stroke="#1A2332" stroke-width="2.4"/>

  <!-- connector -->
  <rect x="226" y="127" width="48" height="30" rx="2" fill="none" stroke="#1A2332" stroke-width="1.6"/>
  <path d="M232 134h36M232 143h36M232 150h36" stroke="#C89B50" stroke-width="1.1"/>

  <!-- sensor body -->
  <rect x="274" y="126" width="34" height="32" fill="none" stroke="#1A2332" stroke-width="1.6"/>
  <path d="M308 120h26l8 12v20l-8 12h-26z" fill="none" stroke="#1A2332" stroke-width="1.6"/>
  <path d="M316 120v44M324 120v44M332 120v44" stroke="#D4CDB0" stroke-width="1"/>
  <rect x="342" y="126" width="72" height="32" fill="none" stroke="#1A2332" stroke-width="1.6"/>
  <path d="M348 126l-6 32M360 126l-6 32M372 126l-6 32M384 126l-6 32M396 126l-6 32M408 126l-6 32" stroke="#C89B50" stroke-width="1.1"/>
  <path d="M414 126h18l10 16-10 16h-18z" fill="none" stroke="#1A2332" stroke-width="1.6"/>
  <path d="M424 136h10M424 145h10M424 154h10" stroke="#C89B50" stroke-width="1.1"/>

  <!-- can bus lines -->
  <g stroke="#C89B50" stroke-width="1" fill="none" stroke-dasharray="4 4">
    <path d="M110 64v-22h44"/>
    <path d="M110 96v24h44"/>
  </g>
  <text x="120" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" letter-spacing="1.6" fill="#8A92A1">CAN / J1939</text>

  <!-- callouts -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6A7280" letter-spacing="1.4">
    <g stroke="#C89B50" stroke-width="1" fill="none">
      <path d="M250 157v40h-58"/>
      <path d="M378 158v39h52"/>
      <path d="M442 190v32h-40"/>
    </g>
    <text x="192" y="212" text-anchor="end">12V / 24V HEATER</text>
    <text x="432" y="244" text-anchor="middle">PUMP CELL</text>
    <text x="404" y="244" text-anchor="end"></text>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1A2332">
    <text x="40" y="292" font-size="11" letter-spacing="3" fill="#C89B50">NOx · DIESEL AFTER-TREATMENT</text>
    <text x="40" y="312" font-size="9.5" letter-spacing="1.2" fill="#8A92A1">SCR SYSTEMS · EURO V / VI · LIGHT TO HEAVY DUTY</text>
  </g>
</svg>
